name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install pytest pillow numpy
      - name: Skill scripts compile
        run: python -m compileall -q h3-multimodal-colab
      - name: Tests (AI-movie planner + script-to-film mode)
        run: python -m pytest -q tests
